name: Refresh data and publish dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 14 1 * *"   # 1st of each month; EDD, MIT and ACS update yearly
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-download every source (otherwise only missing files)"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get install -y p7zip-full
          pip install -r requirements.txt

      - name: Fetch sources
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            python src/fetch.py --refresh
          else
            python src/fetch.py
          fi

      - name: Rebuild tables and dashboard data
        working-directory: src
        run: |
          python need.py
          python wage_screen.py
          python ladder.py
          python export_dashboard.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw data/processed dashboard/data
          git diff --cached --quiet || git commit -m "Refresh data $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
